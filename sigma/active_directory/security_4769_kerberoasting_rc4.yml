title: Kerberoasting — RC4 Service Ticket Requests (Event 4769)
id: e1c33b1b-7002-4aee-9d11-e89c9bbe9410
status: experimental
description: |
  Detects Kerberoasting via Active Directory security logs: a Kerberos service-ticket
  (TGS) request (Event ID 4769) using the weak RC4-HMAC encryption type (0x17) for a
  user service account. Attackers request RC4 tickets for accounts with a Service
  Principal Name (SPN) and crack them offline to recover the service account's password
  — a very common privilege-escalation step inside Active Directory.

  telemetry: AD / Domain Controller Security log (Event ID 4769) — log ที่ลูกค้ามีจริง
  ไม่ต้องมี Sysmon. ในสภาพแวดล้อมเก่าที่ยังใช้ RC4 อาจมี noise — baseline บัญชี/บริการก่อน
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: Nattapong Suraraungchai
date: 2026-09-23
tags:
  - attack.credential-access
  - attack.t1558.003
  - ecop.telemetry.ad
  - ecop.region.th
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'   # RC4-HMAC (weak, requested by Kerberoasting tools)
  filter_machine:
    ServiceName|endswith: '$'       # machine-account tickets are normal
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not (filter_machine or filter_krbtgt)
falsepositives:
  - แอป/บริการรุ่นเก่าที่ยังร้องขอตั๋ว RC4 โดยชอบ (เพิ่มบัญชีเหล่านั้นใน allowlist)
  - บัญชีที่ยังไม่รองรับ AES (ควรปรับให้ใช้ AES แล้วตั้ง alert ให้ไวขึ้น)
level: medium
